services:
  # --- SERVICE BACKEND UNIQUEMENT (Django) ---
  - type: web
    name: portfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false  # À renseigner manuellement (Supabase, Neon, etc.)
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # À renseigner (l'URL de votre site frontend)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
