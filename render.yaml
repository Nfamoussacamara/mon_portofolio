services:
  # --- SERVICE BACKEND (Django) ---
  - type: web
    name: portfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true  # Render génère une clé sécurisée automatiquement
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false  # À renseigner manuellement dans le dashboard Render (ex: Supabase, Neon, Railway...)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://portfolio-frontend.onrender.com"  # Mettre à jour avec l'URL réelle du frontend
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Renseigné manuellement dans le dashboard Render
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # --- SERVICE FRONTEND (React/Vite via Nginx) ---
  - type: web
    name: portfolio-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false  # ex: https://portfolio-backend.onrender.com/api
      - key: VITE_BACKEND_BASE
        sync: false  # ex: https://portfolio-backend.onrender.com
